<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi10 Blog | Admin Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e8e4d9;
            --ink: #1a1a1a;
            --blue: #4a76a8;
            --red: #b84040;
            --green: #3a7a5a;
            --border: 2px solid #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--ink);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            font-family: 'Libre Baskerville', serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-8px); }
            40%       { transform: translateX(8px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(5px); }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .card {
            background: var(--bg);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            width: 100%;
            max-width: 440px;
            border: var(--border);
            animation: fadeUp 0.7s ease-out both;
        }

        .card-header {
            background: var(--ink);
            color: var(--bg);
            padding: 24px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .admin-tag {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 3px;
            background: var(--red);
            color: white;
            padding: 3px 10px;
        }

        .card-body {
            padding: 40px 36px;
        }

        .eyebrow {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: var(--red);
            display: block;
            margin-bottom: 6px;
        }

        .card-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        hr {
            border: none;
            border-top: var(--border);
            margin: 18px 0 28px;
        }

        .warning-box {
            background: rgba(184,64,64,0.07);
            border: 1px solid rgba(184,64,64,0.25);
            border-left: 3px solid var(--red);
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #7a3030;
            margin-bottom: 26px;
            line-height: 1.5;
        }

        .field-group { margin-bottom: 20px; }

        .field-group label {
            display: block;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .field-group input {
            width: 100%;
            padding: 12px 14px;
            background: transparent;
            border: 1px solid var(--ink);
            font-family: 'Libre Baskerville', serif;
            font-size: 0.95rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .field-group input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(74,118,168,0.12);
        }

        .field-group input::placeholder { color: #aaa; }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--red);
            color: white;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 6px;
        }

        .submit-btn:hover { background: #8a2a2a; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .msg-box {
            padding: 11px 14px;
            font-size: 0.85rem;
            margin-bottom: 18px;
            display: none;
            border-left: 3px solid;
        }

        .msg-box.error {
            background: rgba(184,64,64,0.08);
            border-color: var(--red);
            color: var(--red);
        }

        .msg-box.success {
            background: rgba(58,122,90,0.08);
            border-color: var(--green);
            color: var(--green);
        }

        .form-shake { animation: shake 0.4s ease; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: #888;
            text-decoration: none;
        }

        .back-link:hover { color: var(--blue); }

        .card-footer {
            border-top: 1px solid rgba(26,26,26,0.15);
            padding: 14px 36px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 2px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <span class="logo">HI10 BLOG</span>
            <span class="admin-tag">RESTRICTED</span>
        </div>

        <div class="card-body">
            <span class="eyebrow">ADMIN ONLY</span>
            <h1 class="card-title">ADMIN<br>ACCESS</h1>
            <hr>

            <div class="warning-box">
                ⚠ This area is restricted to authorised administrators only. Unauthorised access is prohibited.
            </div>

            <div class="msg-box" id="msg-box"></div>

            <form id="admin-login-form" novalidate>
                <div class="field-group">
                    <label for="admin-user">ADMIN USERNAME</label>
                    <input
                        type="text"
                        id="admin-user"
                        placeholder="admin"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="field-group">
                    <label for="admin-pass">ADMIN PASSWORD</label>
                    <input
                        type="password"
                        id="admin-pass"
                        placeholder="••••••••"
                        autocomplete="off"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span id="btn-text">ENTER ADMIN PANEL</span>
                    <div class="btn-spinner" id="btn-spinner"></div>
                </button>
            </form>

            <a href="index.html" class="back-link">← Back to Hi10 Blog</a>
        </div>

        <div class="card-footer">
            HI10 BLOG • ADMIN PANEL • CONFIDENTIAL
        </div>
    </div>

    <script>
        // -----------------------------------------------
        // CHANGE THESE to your own username and password
        // -----------------------------------------------
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'admin1234';
        // -----------------------------------------------

        // If already logged in, go straight to panel
        if (sessionStorage.getItem('hi10_admin') === 'true') {
            window.location.href = 'admin.html';
        }

        const form       = document.getElementById('admin-login-form');
        const msgBox     = document.getElementById('msg-box');
        const submitBtn  = document.getElementById('submit-btn');
        const btnText    = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        function showMsg(type, text) {
            msgBox.className = 'msg-box ' + type;
            msgBox.textContent = text;
            msgBox.style.display = 'block';
        }

        function setLoading(on) {
            submitBtn.disabled = on;
            btnText.style.display    = on ? 'none' : 'block';
            btnSpinner.style.display = on ? 'block' : 'none';
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            msgBox.style.display = 'none';

            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value;

            if (!user || !pass) {
                showMsg('error', 'Please enter both username and password.');
                triggerShake();
                return;
            }

            setLoading(true);

            // Simulate a short delay for UX
            setTimeout(() => {
                if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
                    sessionStorage.setItem('hi10_admin', 'true');
                    showMsg('success', 'Access granted. Entering admin panel…');
                    setTimeout(() => { window.location.href = 'admin.html'; }, 800);
                } else {
                    showMsg('error', 'Incorrect username or password.');
                    triggerShake();
                    setLoading(false);
                }
            }, 600);
        });

        function triggerShake() {
            form.classList.add('form-shake');
            setTimeout(() => form.classList.remove('form-shake'), 400);
        }
    </script>

</body>
</html>
