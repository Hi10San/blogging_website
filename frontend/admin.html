<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi10 Blog | Admin — Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e8e4d9;
            --ink: #1a1a1a;
            --blue: #4a76a8;
            --red: #b84040;
            --green: #3a7a5a;
            --border: 2px solid #1a1a1a;
            --row-hover: rgba(74,118,168,0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            font-family: 'Libre Baskerville', serif;
            color: var(--ink);
            min-height: 100vh;
            /* Hidden until auth check passes */
            visibility: hidden;
        }

        body.authed { visibility: visible; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Header */
        header {
            border-bottom: var(--border);
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            text-decoration: none;
            color: var(--ink);
        }

        .admin-badge {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: white;
            background: var(--red);
            padding: 3px 10px;
        }

        .header-right { display: flex; align-items: center; gap: 16px; }

        .admin-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #888;
        }

        .logout-btn {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            background: transparent;
            border: 1px solid var(--ink);
            color: var(--ink);
            padding: 5px 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .logout-btn:hover {
            background: var(--red);
            border-color: var(--red);
            color: white;
        }

        /* Page */
        .page {
            max-width: 1400px;
            margin: 0 auto;
            border-left: var(--border);
            border-right: var(--border);
            min-height: calc(100vh - 58px - 52px);
        }

        /* Top bar */
        .top-bar {
            padding: 40px 50px 30px;
            border-bottom: var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            animation: fadeUp 0.6s ease-out both;
        }

        .page-eyebrow {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: var(--red);
            display: block;
            margin-bottom: 4px;
        }

        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            line-height: 0.9;
            text-transform: uppercase;
        }

        .page-subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }

        /* Stats */
        .stats-row {
            display: flex;
            border-bottom: var(--border);
            animation: fadeUp 0.6s 0.1s ease-out both;
        }

        .stat-box {
            flex: 1;
            padding: 24px 40px;
            border-right: 1px solid var(--ink);
        }

        .stat-box:last-child { border-right: none; }

        .stat-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 3px;
            color: #888;
            display: block;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            line-height: 1;
        }

        .stat-value.blue  { color: var(--blue); }
        .stat-value.green { color: var(--green); }
        .stat-value.small { font-size: 1rem; padding-top: 6px; }

        /* Controls */
        .controls-bar {
            padding: 20px 50px;
            border-bottom: 1px solid rgba(26,26,26,0.2);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            animation: fadeUp 0.6s 0.15s ease-out both;
        }

        .search-input {
            padding: 9px 14px;
            background: transparent;
            border: 1px solid var(--ink);
            font-family: 'Libre Baskerville', serif;
            font-size: 0.85rem;
            color: var(--ink);
            outline: none;
            width: 260px;
            transition: border-color 0.3s;
        }

        .search-input:focus { border-color: var(--blue); }
        .search-input::placeholder { color: #aaa; }

        .refresh-btn {
            padding: 9px 20px;
            background: var(--ink);
            color: var(--bg);
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .refresh-btn:hover { background: var(--blue); }

        .result-count {
            font-size: 0.82rem;
            color: #888;
            font-style: italic;
            margin-left: auto;
        }

        /* Table */
        .table-section {
            padding: 0 50px 50px;
            animation: fadeUp 0.6s 0.2s ease-out both;
        }

        .status-bar {
            padding: 14px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            border-bottom: 1px solid rgba(26,26,26,0.12);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            flex-shrink: 0;
        }

        .status-dot.loading { background: var(--blue); animation: pulse 1s infinite; }
        .status-dot.ok      { background: var(--green); }
        .status-dot.error   { background: var(--red); }

        #status-text { color: #666; font-style: italic; }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        .user-table thead tr { border-bottom: var(--border); }

        .user-table th {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 3px;
            color: #888;
            padding: 14px 16px;
            text-align: left;
            font-weight: normal;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .user-table th:hover { color: var(--blue); }
        .user-table th.sorted { color: var(--ink); }

        .sort-arrow { display: inline-block; margin-left: 4px; font-size: 0.7rem; opacity: 0.5; }

        .user-table tbody tr {
            border-bottom: 1px solid rgba(26,26,26,0.1);
            transition: background 0.15s;
        }

        .user-table tbody tr:hover { background: var(--row-hover); }

        .user-table td { padding: 16px; vertical-align: middle; }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            color: white;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .email-cell { display: flex; align-items: center; gap: 12px; }

        .id-badge {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #888;
            background: rgba(0,0,0,0.04);
            padding: 2px 7px;
            border: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: background 0.2s;
            user-select: all;
        }

        .id-badge:hover { background: rgba(74,118,168,0.1); color: var(--blue); }

        .date-text { color: #555; }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .status-pill.active {
            background: rgba(58,122,90,0.1);
            color: var(--green);
            border: 1px solid rgba(58,122,90,0.25);
        }

        .status-pill.active::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
        }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(0,0,0,0.06) 25%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.06) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 2px;
            height: 14px;
        }

        .sk-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: linear-gradient(90deg, rgba(0,0,0,0.06) 25%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.06) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            flex-shrink: 0;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: #999;
        }

        .empty-state .big-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }

        .empty-state h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            color: #bbb;
            margin-bottom: 8px;
        }

        .empty-state p { font-size: 0.85rem; font-style: italic; }
        .empty-state code {
            font-family: monospace;
            background: rgba(0,0,0,0.06);
            padding: 2px 6px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--ink);
            color: var(--bg);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            padding: 10px 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 999;
        }

        .toast.show { opacity: 1; transform: translateY(0); }

        /* Footer */
        footer {
            border-top: var(--border);
            padding: 16px;
            text-align: center;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 2px;
            font-size: 0.78rem;
        }

        @media (max-width: 900px) {
            .top-bar, .controls-bar, .table-section { padding-left: 20px; padding-right: 20px; }
            .stat-box { padding: 20px; }
            .user-table th:nth-child(2), .user-table td:nth-child(2) { display: none; }
        }

        @media (max-width: 600px) {
            header { padding: 10px 20px; }
            .stats-row { flex-direction: column; }
            .stat-box { border-right: none; border-bottom: 1px solid rgba(26,26,26,0.2); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="logo">HI10 BLOG</a>
            <span class="admin-badge">ADMIN</span>
        </div>
        <div class="header-right">
            <span class="admin-name">LOGGED IN AS ADMIN</span>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </div>
    </header>

    <div class="page">

        <div class="top-bar">
            <div>
                <span class="page-eyebrow">ADMIN PANEL</span>
                <h1 class="page-title">REGISTERED<br>USERS</h1>
                <p class="page-subtitle">All accounts stored in MongoDB · Passwords never shown</p>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <span class="stat-label">TOTAL USERS</span>
                <span class="stat-value blue" id="stat-total">—</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">NEWEST MEMBER</span>
                <span class="stat-value small" id="stat-newest">—</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">DATABASE</span>
                <span class="stat-value green" id="stat-db">—</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">LAST REFRESHED</span>
                <span class="stat-value small" id="stat-refreshed">—</span>
            </div>
        </div>

        <div class="controls-bar">
            <input type="text" class="search-input" id="search-input" placeholder="Search by email or ID…">
            <button class="refresh-btn" onclick="loadUsers()">↻ REFRESH</button>
            <span class="result-count" id="result-count"></span>
        </div>

        <div class="table-section">
            <div class="status-bar">
                <div class="status-dot loading" id="status-dot"></div>
                <span id="status-text">Connecting to server…</span>
            </div>

            <table class="user-table" id="user-table">
                <thead>
                    <tr>
                        <th onclick="sortTable('email')" id="th-email">EMAIL ADDRESS <span class="sort-arrow">↕</span></th>
                        <th onclick="sortTable('_id')"   id="th-_id">MONGO ID <span class="sort-arrow">↕</span></th>
                        <th onclick="sortTable('createdAt')" id="th-createdAt" class="sorted">REGISTERED <span class="sort-arrow">↓</span></th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="user-tbody">
                    <tr class="skeleton-row">
                        <td><div style="display:flex;align-items:center;gap:12px"><div class="sk-avatar"></div><div class="skeleton" style="width:200px"></div></div></td>
                        <td><div class="skeleton" style="width:140px"></div></td>
                        <td><div class="skeleton" style="width:120px"></div></td>
                        <td><div class="skeleton" style="width:60px"></div></td>
                    </tr>
                    <tr class="skeleton-row">
                        <td><div style="display:flex;align-items:center;gap:12px"><div class="sk-avatar"></div><div class="skeleton" style="width:160px"></div></div></td>
                        <td><div class="skeleton" style="width:140px"></div></td>
                        <td><div class="skeleton" style="width:120px"></div></td>
                        <td><div class="skeleton" style="width:60px"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>HI10 BLOG ADMIN PANEL • CONFIDENTIAL • © 2024</footer>
    <div class="toast" id="toast"></div>

    <script>
        // -----------------------------------------------
        // CONFIG
        // -----------------------------------------------
        const API_BASE = 'http://localhost:5000';

        // --- Auth guard: redirect if not logged in ---
        if (sessionStorage.getItem('hi10_admin') !== 'true') {
            window.location.href = 'admin-login.html';
        } else {
            document.body.classList.add('authed');
        }

        function logout() {
            sessionStorage.removeItem('hi10_admin');
            window.location.href = 'admin-login.html';
        }

        // --- State ---
        let allUsers = [];
        let sortKey  = 'createdAt';
        let sortDir  = 'desc';

        const tbody     = document.getElementById('user-tbody');
        const statusDot = document.getElementById('status-dot');
        const statusTxt = document.getElementById('status-text');

        // --- Helpers ---
        function setStatus(state, text) {
            statusDot.className = 'status-dot ' + state;
            statusTxt.textContent = text;
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
                 + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        }

        const avatarColors = ['#4a76a8','#8a5a9a','#a87c4a','#3a7a5a','#a84a4a','#4a8a7a'];

        function avatarColor(email) {
            return avatarColors[(email ? email.charCodeAt(0) : 0) % avatarColors.length];
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1800);
        }

        function copyId(id) {
            navigator.clipboard.writeText(id).then(() => showToast('ID COPIED'));
        }

        // --- Render ---
        function renderTable(users) {
            document.getElementById('result-count').textContent =
                users.length === allUsers.length
                    ? allUsers.length + ' users total'
                    : users.length + ' of ' + allUsers.length + ' shown';

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4">
                    <div class="empty-state">
                        <div class="big-icon">👤</div>
                        <h3>No Users Found</h3>
                        <p>Try a different search term, or register the first account.</p>
                    </div></td></tr>`;
                return;
            }

            tbody.innerHTML = users.map((u, i) => `
                <tr style="animation:fadeUp 0.4s ${i*0.04}s ease-out both;opacity:0">
                    <td>
                        <div class="email-cell">
                            <div class="user-avatar" style="background:${avatarColor(u.email)}">
                                ${u.email ? u.email[0].toUpperCase() : '?'}
                            </div>
                            <span>${u.email}</span>
                        </div>
                    </td>
                    <td>
                        <span class="id-badge" title="Click to copy" onclick="copyId('${u._id}')">
                            ${u._id}
                        </span>
                    </td>
                    <td><span class="date-text">${formatDate(u.createdAt)}</span></td>
                    <td><span class="status-pill active">ACTIVE</span></td>
                </tr>
            `).join('');
        }

        // --- Sort ---
        function sortTable(key) {
            sortDir = (sortKey === key && sortDir === 'asc') ? 'desc' : 'asc';
            sortKey = key;

            document.querySelectorAll('.user-table th').forEach(th => {
                th.classList.remove('sorted');
                th.querySelector('.sort-arrow').textContent = '↕';
            });

            const th = document.getElementById('th-' + key);
            if (th) {
                th.classList.add('sorted');
                th.querySelector('.sort-arrow').textContent = sortDir === 'asc' ? '↑' : '↓';
            }

            const sorted = [...allUsers].sort((a, b) => {
                const av = (a[key] || '').toString().toLowerCase();
                const bv = (b[key] || '').toString().toLowerCase();
                return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
            });

            renderTable(applySearch(sorted));
        }

        // --- Search ---
        function applySearch(users) {
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            return q ? users.filter(u =>
                (u.email || '').toLowerCase().includes(q) ||
                (u._id   || '').toLowerCase().includes(q)
            ) : users;
        }

        document.getElementById('search-input').addEventListener('input', () => {
            renderTable(applySearch(allUsers));
        });

        // --- Stats ---
        function updateStats(users) {
            document.getElementById('stat-total').textContent    = users.length;
            document.getElementById('stat-newest').textContent   = users[0] ? users[0].email : 'None yet';
            document.getElementById('stat-db').textContent       = 'hi10blog';
            document.getElementById('stat-refreshed').textContent =
                new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // --- Load users ---
        async function loadUsers() {
            setStatus('loading', 'Fetching users from MongoDB…');
            try {
                const res  = await fetch(`${API_BASE}/api/users`);
                if (!res.ok) throw new Error('Server returned ' + res.status);
                const data = await res.json();
                allUsers   = data.users || [];
                updateStats(allUsers);
                renderTable(applySearch(allUsers));
                setStatus('ok', `Loaded ${allUsers.length} user${allUsers.length !== 1 ? 's' : ''} · hi10blog`);
            } catch (err) {
                setStatus('error', 'Cannot reach server — is it running on port 5000?');
                tbody.innerHTML = `<tr><td colspan="4">
                    <div class="empty-state">
                        <div class="big-icon">⚠️</div>
                        <h3>Server Unreachable</h3>
                        <p>Make sure your server is running:<br>
                        <code>node server.js</code><br><br>
                        Then click <strong>↻ REFRESH</strong>.</p>
                    </div></td></tr>`;
                document.getElementById('stat-total').textContent = '—';
                document.getElementById('stat-db').textContent    = 'OFFLINE';
            }
        }

        loadUsers();
        setInterval(loadUsers, 30000);
    </script>

</body>
</html>
